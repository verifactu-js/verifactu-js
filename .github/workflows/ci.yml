name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to notice changes in the AEAT technical documentation and services.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.1.2

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      # `fetch-depth: 0` because the scan walks the whole history, not just the tip: a secret
      # that was committed and then removed is still a leaked secret.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # We install the gitleaks binary instead of using gitleaks/gitleaks-action.
      #
      # The binary is MIT-licensed and free. The Action wrapper is not: for repositories owned
      # by an organisation — which this one is — it refuses to run without a paid GITLEAKS_LICENSE
      # secret. Running the binary directly gets the same scan with no licence, no third-party
      # action in the supply chain, and no Node 20 deprecation warnings from the wrapper.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  quality:
    name: Lint, typecheck, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @verifactu-js/core@0.1.0 shipped with an unsubstituted repository placeholder in its
      # package.json, so the npm page linked to a repository that does not exist. npm versions
      # are immutable, so it needed a 0.1.1. This step is why it cannot happen twice.
      # (The literal strings live in scripts/check-placeholders.mjs, which excludes itself.)
      - name: Unsubstituted placeholders
        run: pnpm check:placeholders

      # npm renders package READMEs with a different pipeline from GitHub's, and relative links
      # from a monorepo subdirectory are the usual casualty. Published versions are immutable.
      - name: README structure
        run: pnpm check:readmes

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Thresholds live in vitest.config.ts (95% across the board). The job fails on its own if
      # coverage drops; there is no separate gate to forget to update.
      - name: Tests and coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage
          retention-days: 7

  runtimes:
    name: core on ${{ matrix.runtime }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node-20
          - runtime: node-22
          - runtime: node-24
          - runtime: bun
          - runtime: deno
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The smoke test runs against the built bundle, which is what users actually consume.
      - name: Build core
        run: pnpm --filter @verifactu-js/core build

      - name: Set up Node ${{ matrix.runtime }}
        if: startsWith(matrix.runtime, 'node-')
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'node-20' && '20' || matrix.runtime == 'node-22' && '22' || '24' }}

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test
        working-directory: packages/core
        run: |
          case "${{ matrix.runtime }}" in
            node-*) node runtime-smoke.mjs ;;
            bun)    bun runtime-smoke.mjs ;;
            deno)   deno run --allow-read runtime-smoke.mjs ;;
          esac
